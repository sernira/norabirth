<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a14;
      height: 100vh;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .star.text-star {
      background: #ffe9a8;
      box-shadow: 0 0 6px rgba(255, 233, 168, 0.8);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <script>
    const STAR_COUNT = 120;
    const TEXT = 'Nora';

    function createStar(x, y, size, isTextStar) {
      const star = document.createElement('div');
      star.className = 'star' + (isTextStar ? ' text-star' : '');
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = x;
      star.style.top = y;
      star.style.setProperty('--duration', (Math.random() * 4 + 4) + 's');
      star.style.setProperty('--delay', (Math.random() * 4) + 's');
      document.body.appendChild(star);
    }

    // ستاره‌های پس‌زمینه
    for (let i = 0; i < STAR_COUNT; i++) {
      createStar(
        Math.random() * 100 + '%',
        Math.random() * 100 + '%',
        Math.random() * 2 + 1,
        false
      );
    }

    // ستاره‌های متن Nora
    function getTextStars() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      ctx.font = 'bold ' + Math.min(canvas.width / 4, 160) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText(TEXT, canvas.width / 2, canvas.height / 2);

      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const step = 6;

      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          if (pixels[(y * canvas.width + x) * 4 + 3] > 128) {
            createStar(x + 'px', y + 'px', Math.random() * 1.5 + 1.5, true);
          }
        }
      }
    }

    getTextStars();
  </script>
</body>
</html>
